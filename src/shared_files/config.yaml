# ArmorClassifier 参数
MAX_ROI_SAVE_COUNT : 20000  # 最大保存数量
classify_classes : 8
IS_ARMOR_THRESHOLD : 0.5
IS_LARGE_THRESHOLD : 0.5
CLASSIFY_THRESHOLD : 0.5
INPUT_HEIGHT : 48
INPUT_WIDTH : 64
MAX_TRACKING_AGE_MS : 100  # 最大跟踪时间100ms // DEBUG // 100 // 300
MIN_TRACKING_COUNT : 2     # 最小连续跟踪次数           // 2
